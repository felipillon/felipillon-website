services:
  - type: web
    name: felipillon-backend
    runtime: python
    rootDir: backend
    buildCommand: python -m pip install -r requirements.txt
    startCommand: python -m uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: TEAM_EMAIL
        sync: false
      - key: FROM_EMAIL
        sync: false
      - key: MANATAL_CLIENT_SLUG
        sync: false
