<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" role="img">
  <title>Felipillon</title>

  <!-- City skyline behind figures -->
  <g fill="rgba(255,255,255,0.18)">
    <!-- Left building -->
    <rect x="60" y="60" width="30" height="100"/>
    <rect x="50" y="75" width="12" height="85"/>
    <!-- Centre-left tower -->
    <rect x="148" y="30" width="22" height="130"/>
    <rect x="140" y="55" width="10" height="105"/>
    <!-- Centre tower (tall) -->
    <rect x="195" y="15" width="28" height="145"/>
    <rect x="190" y="35" width="10" height="125"/>
    <!-- Centre-right -->
    <rect x="255" y="45" width="20" height="115"/>
    <!-- Right building -->
    <rect x="330" y="65" width="28" height="95"/>
    <rect x="358" y="80" width="12" height="80"/>
  </g>

  <!-- ── FIGURE 1 — far left man, arms at sides ── -->
  <g fill="white">
    <!-- Head -->
    <ellipse cx="88" cy="72" rx="16" ry="18"/>
    <!-- Neck -->
    <rect x="83" y="88" width="10" height="8" rx="2"/>
    <!-- Body/jacket -->
    <path d="M65 96 Q76 88 88 96 Q100 88 111 96 L114 175 L62 175 Z"/>
    <!-- Lapels -->
    <path d="M80 96 L86 120 L88 123 L90 120 L96 96 L88 104 Z" fill="rgba(0,0,0,0.15)"/>
    <!-- Left arm -->
    <path d="M62 96 L48 148 L58 151 L68 102 Z"/>
    <!-- Right arm -->
    <path d="M114 96 L128 148 L118 151 L108 102 Z"/>
    <!-- Legs -->
    <rect x="70" y="175" width="14" height="55" rx="4"/>
    <rect x="86" y="175" width="14" height="55" rx="4"/>
    <!-- Shoes -->
    <ellipse cx="77" cy="231" rx="12" ry="5"/>
    <ellipse cx="93" cy="231" rx="12" ry="5"/>
  </g>

  <!-- ── FIGURE 2 — woman holding folder ── -->
  <g fill="white">
    <ellipse cx="152" cy="68" rx="15" ry="17"/>
    <rect x="147" y="83" width="10" height="8" rx="2"/>
    <path d="M130 92 Q141 84 152 92 Q163 84 174 92 L176 168 L128 168 Z"/>
    <!-- Left arm down with folder -->
    <path d="M128 92 L116 140 L126 143 L135 96 Z"/>
    <!-- Folder -->
    <rect x="108" y="128" width="22" height="28" rx="3" fill="rgba(255,255,255,0.7)"/>
    <rect x="110" y="130" width="18" height="2" fill="rgba(0,0,0,0.2)"/>
    <rect x="110" y="135" width="18" height="2" fill="rgba(0,0,0,0.2)"/>
    <!-- Right arm -->
    <path d="M174 92 L186 138 L176 141 L168 98 Z"/>
    <rect x="138" y="168" width="13" height="52" rx="4"/>
    <rect x="153" y="168" width="13" height="52" rx="4"/>
    <ellipse cx="144" cy="221" rx="11" ry="5"/>
    <ellipse cx="160" cy="221" rx="11" ry="5"/>
  </g>

  <!-- ── FIGURE 3 — centre man, tallest, thinking pose ── -->
  <g fill="white">
    <ellipse cx="222" cy="62" rx="18" ry="20"/>
    <rect x="216" y="80" width="12" height="9" rx="2"/>
    <path d="M194 90 Q208 80 222 90 Q236 80 250 90 L253 178 L191 178 Z"/>
    <!-- Tie -->
    <polygon points="222,90 218,118 222,122 226,118" fill="rgba(0,0,0,0.15)"/>
    <!-- Left arm up — thinking/hand on chin -->
    <path d="M191 90 L175 118 L165 112 L180 86 Z"/>
    <ellipse cx="162" cy="110" rx="9" ry="6" transform="rotate(-20 162 110)"/>
    <!-- Right arm down -->
    <path d="M253 90 L267 145 L257 148 L247 96 Z"/>
    <rect x="201" y="178" width="15" height="58" rx="4"/>
    <rect x="218" y="178" width="15" height="58" rx="4"/>
    <ellipse cx="208" cy="237" rx="13" ry="5.5"/>
    <ellipse cx="226" cy="237" rx="13" ry="5.5"/>
  </g>

  <!-- ── FIGURE 4 — woman, arms crossed ── -->
  <g fill="white">
    <ellipse cx="310" cy="72" rx="15" ry="17"/>
    <rect x="305" y="87" width="10" height="8" rx="2"/>
    <path d="M288 96 Q299 88 310 96 Q321 88 332 96 L334 172 L286 172 Z"/>
    <!-- Arms crossed -->
    <path d="M286 102 Q292 122 310 126 Q328 122 334 102 L331 99 Q323 118 310 121 Q297 118 289 99 Z"/>
    <rect x="294" y="172" width="13" height="52" rx="4"/>
    <rect x="309" y="172" width="13" height="52" rx="4"/>
    <ellipse cx="300" cy="225" rx="11" ry="5"/>
    <ellipse cx="316" cy="225" rx="11" ry="5"/>
  </g>

  <!-- ── WORDMARK ── -->
  <text
    x="210"
    y="265"
    text-anchor="middle"
    font-family="'Outfit', 'Georgia', serif"
    font-weight="700"
    font-size="38"
    letter-spacing="6"
    fill="white"
  >FELIPILLON</text>

</svg>
